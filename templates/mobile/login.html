{% extends "mobile/base_mobile.html" %}

{% block title %}Logowanie – Magazyn ZSR{% endblock %}

{% block content %}

<div class="text-center mt-4 mb-4">
    <h4 style="color:#fff;">Logowanie</h4>
    <p style="color:#adc4e3;">Przyłóż kartę NFC do czytnika</p>

    <button id="test-nfc" class="btn btn-warning btn-touch mt-3">
        Zezwól na NFC
    </button>
</div>

<div class="mobile-card text-center">
    <div class="nfc-pulse" id="nfc-pulse">📡</div>

    <div id="nfc-status" style="color:#adc4e3; margin-top:12px;">
        Oczekiwanie na kartę...
    </div>

    <div id="nfc-error" class="alert alert-danger mt-3" style="display:none;"></div>
</div>

<input id="nfc-input" type="text"
       style="position:fixed;top:-1000px;left:-1000px;width:1px;height:1px;"
       autocomplete="off">

<div class="text-center mt-4">
    <a href="{{ url_for('user_controller.cas_login') }}"
       style="
            color:#7a9bbf;
            font-size:0.85rem;
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            gap:6px;
            border:1px solid #2e4060;
            border-radius:10px;
            padding:8px 18px;
            background:#11284d;
       ">
        <i class="bi bi-grid"></i>
        Przejdź do wersji webowej
    </a>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/nfc.js') }}"></script>
<script>

const statusEl = document.getElementById("nfc-status");
const errorEl  = document.getElementById("nfc-error");
const pulseEl  = document.getElementById("nfc-pulse");

// =====================================================
// PRZYCISK TEST – tylko sprawdza czy NFC działa
// =====================================================
document.getElementById("test-nfc").addEventListener("click", async () => {
    try {
        const ndef = new NDEFReader();
        await ndef.scan();

        statusEl.textContent = "NFC aktywne – przyłóż kartę";
        console.log("[TEST] NFC enabled");

        ndef.addEventListener("reading", (event) => {
            console.log("[TEST] serialNumber:", event.serialNumber);
            statusEl.textContent = "Odczytano UID: " + String(event.serialNumber);
        });

        ndef.addEventListener("readingerror", (e) => {
            console.error("[TEST] readingerror", e);
            statusEl.textContent = "Błąd odczytu NFC";
        });

    } catch (e) {
        console.error("[TEST] NFC ERROR", e);
        statusEl.textContent = "Błąd: " + e.message;
    }
});

// =====================================================
// LOGOWANIE NFC przez NFCReader
// =====================================================
const reader = new NFCReader("nfc-input", async function(data) {

    console.log("[LOGIN] NFC callback, data:", data);

    statusEl.textContent = "Weryfikacja karty...";
    pulseEl.style.animationPlayState = "paused";
    errorEl.style.display = "none";

    const uid = data?.id || null;

    console.log("[LOGIN] UID:", uid);

    if (!uid) {
        errorEl.textContent = "Nie udało się odczytać UID karty.";
        errorEl.style.display = "block";
        statusEl.textContent = "Błąd odczytu";
        pulseEl.style.animationPlayState = "running";
        return;
    }

    try {
        const response = await fetch(
            "{{ url_for('auth_mobile.mobile_login_nfc') }}",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nfc_hash: uid })
            }
        );

        const json = await response.json();
        console.log("[LOGIN] Response:", json);

        if (json.success) {
            statusEl.textContent = "Zalogowano: " + json.full_name;
            window.location.href = json.redirect_url ||
                "{{ url_for('mobile_controller.mobile_dashboard') }}";
            return;
        }

        errorEl.textContent = json.error || "Nieznany błąd.";
        errorEl.style.display = "block";
        statusEl.textContent = "Spróbuj ponownie";
        pulseEl.style.animationPlayState = "running";

    } catch (err) {
        console.error("[LOGIN] FETCH ERROR:", err);
        errorEl.textContent = "Błąd połączenia z serwerem.";
        errorEl.style.display = "block";
        statusEl.textContent = "Błąd połączenia";
        pulseEl.style.animationPlayState = "running";
    }
});

reader.startListening();

</script>
{% endblock %}
