{% extends "base.html" %}

{% block title %}Edytuj użytkownika{% endblock %}

{% block content %}
<div class="container">

    <h2 class="mb-4">Edytuj użytkownika</h2>

    <form method="POST" action="{{ url_for('user_controller.edit_user_post', id=user.user_id) }}">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                Dane użytkownika
            </div>

            <div class="card-body">

                <!-- Login CAS -->
                <div class="mb-3">
                    <label class="form-label">Login CAS *</label>
                    <input type="text" name="cas_login" class="form-control"
                           value="{{ user.cas_login }}" required>
                </div>

                <!-- Imię i nazwisko -->
                <div class="mb-3">
                    <label class="form-label">Imię i nazwisko</label>
                    <input type="text" name="full_name" class="form-control"
                           value="{{ user.full_name }}">
                </div>

                <!-- Rola -->
                <div class="mb-3">
                    <label class="form-label">Rola</label>
                    <select name="role" class="form-select">
                        <option value="viewer"  {% if user.role == 'viewer' %}selected{% endif %}>viewer</option>
                        <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>manager</option>
                        <option value="admin"   {% if user.role == 'admin' %}selected{% endif %}>admin</option>
                    </select>
                </div>

                <!-- Aktywny -->
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox"
                           name="is_active" id="is_active"
                           {% if user.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">
                        Aktywny
                    </label>
                </div>

            </div>
        </div>

        <button type="submit" class="btn btn-success mt-3">
            <i class="bi bi-check-circle"></i> Zapisz zmiany
        </button>

    </form>

</div>
{% endblock %}
