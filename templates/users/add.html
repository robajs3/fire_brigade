{% extends "base.html" %}

{% block title %}Dodaj użytkownika{% endblock %}

{% block content %}
<div class="container">

    <h2 class="mb-4">Dodaj użytkownika</h2>

    <form method="POST" action="{{ url_for('user_controller.add_user_post') }}">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                Dane użytkownika
            </div>

            <div class="card-body">

                <!-- Login CAS -->
                <div class="mb-3">
                    <label class="form-label">Login CAS *</label>
                    <input type="text" name="cas_login" class="form-control" required>
                </div>

                <!-- Imię i nazwisko -->
                <div class="mb-3">
                    <label class="form-label">Imię i nazwisko</label>
                    <input type="text" name="full_name" class="form-control">
                </div>

                <!-- Rola -->
                <div class="mb-3">
                    <label class="form-label">Rola</label>
                    <select name="role" class="form-select">
                        <option value="viewer">viewer</option>
                        <option value="manager">manager</option>
                        <option value="admin">admin</option>
                    </select>
                </div>

                <!-- Aktywny -->
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" checked>
                    <label class="form-check-label" for="is_active">
                        Aktywny
                    </label>
                </div>

            </div>
        </div>

        <button type="submit" class="btn btn-success mt-3">
            <i class="bi bi-check-circle"></i> Zapisz użytkownika
        </button>

    </form>

</div>
{% endblock %}
