{% extends "base.html" %}
{% block title %}Dodaj do katalogu{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <h2 class="mb-4">Dodaj pozycję do katalogu</h2>

    <form method="POST" action="{{ url_for('catalog_controller.add_catalog_post') }}">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nazwa <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           placeholder="Np. Kurtka bojowa">
                </div>
                <div class="mb-3">
                    <label class="form-label">Jednostka miary</label>
                    <select name="unit_of_measure" class="form-select">
                        <option value="szt">szt</option>
                        <option value="para">para</option>
                        <option value="kg">kg</option>
                        <option value="l">l</option>
                        <option value="m">m</option>
                        <option value="komplet">komplet</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Okres używania (miesiące)</label>
                    <input type="number" name="usage_period_months" class="form-control"
                           min="1" placeholder="Pozostaw puste – 'do zużycia'">
                </div>
                <div class="mb-3">
                    <label class="form-label">Domyślne uwagi <span class="text-muted">(opcjonalne)</span></label>
                    <textarea name="default_notes" class="form-control" rows="2"></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Dodaj
            </button>
            <a href="{{ url_for('catalog_controller.catalog_list') }}"
               class="btn btn-outline-secondary">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
