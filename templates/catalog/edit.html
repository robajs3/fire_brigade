{% extends "base.html" %}
{% block title %}Edytuj katalog{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <h2 class="mb-4">Edytuj pozycję: {{ entry.name }}</h2>

    <form method="POST" action="{{ url_for('catalog_controller.edit_catalog_post', id=entry.catalog_id) }}">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nazwa <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control"
                           value="{{ entry.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Jednostka miary</label>
                    <select name="unit_of_measure" class="form-select">
                        {% for u in ['szt','para','kg','l','m','komplet'] %}
                        <option value="{{ u }}" {% if entry.unit_of_measure == u %}selected{% endif %}>{{ u }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Okres używania (miesiące)</label>
                    <input type="number" name="usage_period_months" class="form-control"
                           min="1" value="{{ entry.usage_period_months or '' }}"
                           placeholder="Pozostaw puste – 'do zużycia'">
                </div>
                <div class="mb-3">
                    <label class="form-label">Domyślne uwagi</label>
                    <textarea name="default_notes" class="form-control" rows="2">{{ entry.default_notes or '' }}</textarea>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="is_active" class="form-check-input"
                           id="is_active" {% if entry.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Aktywna</label>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Zapisz
            </button>
            <a href="{{ url_for('catalog_controller.catalog_list') }}"
               class="btn btn-outline-secondary">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
